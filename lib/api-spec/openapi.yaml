openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quotes
    description: Quote requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /quotes:
    post:
      operationId: submitQuote
      tags: [quotes]
      summary: Submit a quote request
      description: Saves a non-binding quote request for the business owner to review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequestInput"
      responses:
        "201":
          description: Quote request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequestReceipt"
        "400":
          description: Invalid quote request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QuoteLineInput:
      type: object
      properties:
        selectionType:
          type: string
          enum: [product, combo]
        selectionId:
          type: string
          minLength: 1
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 160
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
        unitPrice:
          type: number
          minimum: 0
          maximum: 1000000
        lineTotal:
          type: number
          minimum: 0
          maximum: 10000000
      required:
        - selectionType
        - selectionId
        - name
        - quantity
        - unitPrice
        - lineTotal
    QuoteRequestInput:
      type: object
      properties:
        companyName:
          type: string
          minLength: 1
          maxLength: 160
        contactName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: ["string", "null"]
          maxLength: 40
        apartmentCount:
          type: ["integer", "null"]
          minimum: 0
          maximum: 1000000
        items:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/QuoteLineInput"
        totalUnits:
          type: integer
          minimum: 1
          maximum: 1000000
        estimatedTotal:
          type: number
          minimum: 0
          maximum: 10000000
        notes:
          type: ["string", "null"]
          maxLength: 2000
      required:
        - companyName
        - contactName
        - email
        - items
        - totalUnits
        - estimatedTotal
    QuoteRequestReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
      required:
        - id
        - receivedAt
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

